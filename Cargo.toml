[package]
# The package is `nostdb` and the library target is `nostdb_cli`.
#
# `docs/PRD.md` section 25.3 publishes the source-install route as
# `cargo install --git ... --tag <version> --locked nostdb`, and that trailing word is a *package*
# name, not a binary name. With the package called `nostdb-cli` the published command failed with
# "could not find `nostdb`" — verified against the v0.1.0 tag, which is how this was found.
#
# The library target keeps its own name, so nothing that says `use nostdb_cli::` changes. The
# repository stays `nostdb-cli`, because the repository is the boundary and the package is what cargo
# resolves; they are allowed to differ and here they have to.
name = "nostdb"
# 0.1.2 carries six Stages: the Kotlin analyzer, the bundled GitHub provider, the plugin index, Spring
# route extraction, `CYPHER_UNKNOWN_LABEL`, and the pin and diagnostic corrections around them.
#
# A patch number understates this by more than 0.1.1's did, and that was said before it was chosen. Two
# things it understates:
#
# - `plugin_install_version` went 1 to 2, so a plugin **record** written by an older build is refused
#   rather than read. Nothing has such a record — no published build could install a plugin, because the
#   provider was never bundled until now — which makes the cost zero in practice and does not make the
#   break smaller;
# - `GRAPH_SCHEMA_VERSION` went 2 to 4, so the first build after this redraws the graph it holds.
#
# Recorded here because a version is what an implementation reports it can do, and somebody reading
# `~0.1.1` in a lock file deserves to find out from this file rather than from a refused record.
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "SSPL-1.0"
description = "NostDB command-line interface. Source-available under SSPL-1.0."
publish = false

[lib]
name = "nostdb_cli"
path = "src/lib.rs"

[[bin]]
name = "nostdb"
path = "src/main.rs"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
missing_errors_doc = "deny"
missing_panics_doc = "deny"

# Dependency review:
#
# nostdb-core  Purpose: the Engine. Every database behavior this crate exposes is a
#              call into it, because only the Engine writes `.nostdb` and no command
#              may hold a second parser, storage engine, or query engine.
#              Pinned to an exact commit rather than a branch, because
#              docs/REPOSITORIES.md requires a reproducible build and forbids a
#              floating dependency. A path dependency was rejected: this repository
#              must build on its own, and CI checks it out without its siblings.
#              Maintenance: this workspace.
#              License: SSPL-1.0.
#
# serde_json    Purpose: rendering the result envelope. The Engine builds the envelope
#               as a `serde_json::Value`, so writing it is serializing a value this
#               crate already holds rather than re-deriving the shape. A second
#               rendering here would be a second place the published shape could drift.
#               Maintenance: active, serde-rs/json.
#               License: MIT OR Apache-2.0.
#
# No argument-parsing crate is used. The command surface is small and its exit
# classes are normative, so the parser here is written by hand to keep the mapping
# from a malformed invocation to exit class 2 explicit rather than delegated.
# nostdb-server  Purpose: the catalog type and the protocol's framing and messages. AGENTS.md
#                prohibits this repository from owning a named-database catalog or an IPC
#                transport and permits it to own the daemon *client*, so the client is here and
#                the things it speaks are imported rather than reimplemented. A second catalog
#                writer or a second framing would be exactly the duplication the root contract
#                forbids, and the two would drift on the first change to either.
#                Pinned to an exact commit, for the same reason as the Engine.
#                Maintenance: this workspace.
#                License: SSPL-1.0.
[dependencies]
serde_json = "1"
nostdb-server = { git = "https://github.com/nostdb/nostdb-server.git", rev = "bb5f1f80d01d7931af125e8b9883b2440bd5ec82" }
nostdb-core = { git = "https://github.com/nostdb/nostdb-core.git", rev = "d7b30c19d626acab2840f343ac2c5ad7b6a83a12" }

[dev-dependencies]
serde_json = "1"
